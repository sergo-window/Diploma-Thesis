databaseChangeLog:
  - changeSet:
      id: 001-create-tables
      author: your_name
      changes:
        # Таблица users
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: username
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: first_name
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
              - column:
                  name: last_name
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
              - column:
                  name: phone
                  type: VARCHAR(20)
              - column:
                  name: role
                  type: VARCHAR(10)
                  defaultValue: USER
                  constraints:
                    nullable: false
              - column:
                  name: image_url
                  type: VARCHAR(255)
              - column:
                  name: enabled
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP

        # Таблица ads
        - createTable:
            tableName: ads
            columns:
              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: image_url
                  type: VARCHAR(255)
              - column:
                  name: author_id
                  type: INT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_ads_author
                    references: users(id)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP

        # Таблица comments
        - createTable:
            tableName: comments
            columns:
              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: text
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: author_id
                  type: INT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_comments_author
                    references: users(id)
              - column:
                  name: ad_id
                  type: INT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_comments_ad
                    references: ads(id)
                    onDelete: CASCADE
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP

        # Индексы
        - createIndex:
            tableName: users
            indexName: idx_users_username
            columns:
              - column:
                  name: username

        - createIndex:
            tableName: ads
            indexName: idx_ads_author
            columns:
              - column:
                  name: author_id

        - createIndex:
            tableName: comments
            indexName: idx_comments_ad
            columns:
              - column:
                  name: ad_id

        - createIndex:
            tableName: comments
            indexName: idx_comments_author
            columns:
              - column:
                  name: author_id
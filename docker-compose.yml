version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: avito-postgres
    environment:
      POSTGRES_DB: Diploma-Thesis-ADS
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Jnlfktrf@1974
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build: .
    container_name: avito-backend
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/Diploma-Thesis-ADS
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: Jnlfktrf@1974
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    image: ghcr.io/dmitry-bizin/front-react-avito:v1.21
    container_name: avito-frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:8080
    restart: unless-stopped

volumes:
  postgres_data:
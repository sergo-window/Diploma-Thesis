version: '3.8'

networks:
  avito-network:
    driver: bridge

services:
  postgres:
    image: postgres:15-alpine
    container_name: avito-postgres
    networks:
      - avito-network
    environment:
      POSTGRES_DB: Diploma-Thesis-ADS
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Jnlfktrf@1974
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: .
    container_name: avito-backend
    networks:
      - avito-network
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/Diploma-Thesis-ADS
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: Jnlfktrf@1974
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"
    volumes:
      - ./uploads:/app/uploads
    restart: unless-stopped

  frontend:
    image: ghcr.io/dmitry-bizin/front-react-avito:v1.21
    container_name: avito-frontend
    networks:
      - avito-network
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://backend:8080
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data: